name: Enviar Cursos Gratuitos a Telegram
name: Enviar Cursos Gratuitos a Telegram

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar libreria de peticiones
        run: pip install requests

      - name: Ejecutar el buscador de cursos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python buscador_cursos.py
